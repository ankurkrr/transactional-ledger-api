name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Pyright Type Check
        run: uv run pyright

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Bandit AST Security Scan
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run pip-audit Vulnerability Scan (Full Environment)
        run: uv run pip-audit

      - name: Run pip-audit Vulnerability Scan (Production Only)
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements-prod.txt
          uv run pip-audit -r requirements-prod.txt
          rm requirements-prod.txt

  test:
    name: Test Suite (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledger_test
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_app -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://ledger_app:test_password@localhost:5432/ledger_test"
        run: uv run alembic upgrade head

      - name: Run pytest
        env:
          ENVIRONMENT: test
          ALLOW_UNAUTHENTICATED_ACCESS: "true"
          DATABASE_URL: "postgresql+asyncpg://ledger_app:test_password@localhost:5432/ledger_test"
          SECRET_KEY: "test_secret_key_minimum_32_characters_long_for_ci"
        run: uv run pytest -v
