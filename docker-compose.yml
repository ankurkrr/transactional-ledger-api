services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledger}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_UNAUTHENTICATED_ACCESS: ${ALLOW_UNAUTHENTICATED_ACCESS:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-ledger_app}:${POSTGRES_APP_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ledger}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_MIGRATOR_USER:-ledger_migrator}:${POSTGRES_MIGRATOR_PASSWORD:-migrator_password}@postgres:5432/${POSTGRES_DB:-ledger}
      SECRET_KEY: ${SECRET_KEY:-dev_insecure_default_secret_key_minimum_32_characters_long}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: ledger_postgres_data
